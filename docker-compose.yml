services:
  twin-state-mgr:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.twin_state_mgr
    ports:
      - "${TWIN_STATE_MGR_PORT:-8001}:8001"
    volumes:
      - twin_data:/app/data
      - ./simulator/configs:/app/simulator/configs
    environment:
      - CLIMATEDT_DATA_DIR=${CLIMATEDT_DATA_DIR:-/app/data}
      - TWIN_STORE_DIR=/app/data/twin_store
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  forecast-engine:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.forecast
    ports:
      - "${FORECAST_PORT:-8006}:8006"
    depends_on:
      twin-state-mgr:
        condition: service_healthy
    volumes:
      - model_data:/app/models
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 1G
          cpus: "0.5"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  scenario-engine:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.scenario
    ports:
      - "${SCENARIO_PORT:-8002}:8002"
    depends_on:
      twin-state-mgr:
        condition: service_healthy
    volumes:
      - twin_data:/app/data
      - ./simulator/configs:/app/simulator/configs
    environment:
      - TWIN_STORE_DIR=/app/data/twin_store
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  risk-engine:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.risk
    ports:
      - "${RISK_PORT:-8003}:8003"
    depends_on:
      twin-state-mgr:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  rag-service:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.rag
    ports:
      - "${RAG_PORT:-8004}:8004"
    volumes:
      - vector_store:/app/knowledge/vector_store
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  ollama:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.ollama
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4.0"
        reservations:
          memory: 2G
          cpus: "1.0"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  copilot-agent:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.copilot
    ports:
      - "${COPILOT_PORT:-8005}:8005"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_TIMEOUT=300
      - API_BASE_URL=http://fastapi-gateway:8000
      - FORECAST_ENGINE_URL=http://forecast-engine:8006
      - RISK_SERVICE_URL=http://risk-engine:8003
      - TWIN_SERVICE_URL=http://twin-state-mgr:8001
      - RAG_SERVICE_URL=http://rag-service:8004
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GATEWAY_HOST=fastapi-gateway
      - GATEWAY_PORT=8000
    depends_on:
      ollama:
        condition: service_healthy
      rag-service:
        condition: service_started
      risk-engine:
        condition: service_started
      scenario-engine:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/live')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  fastapi-gateway:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.gateway
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - GATEWAY_CORS_ORIGINS=${GATEWAY_CORS_ORIGINS:-http://localhost:3000,http://localhost:8501}
      - GATEWAY_API_KEY_ENABLED=${GATEWAY_API_KEY_ENABLED:-false}
      - TWIN_HEALTH_URL=http://twin-state-mgr:8001/health
      - TWIN_ENGINE_URL=http://twin-state-mgr:8001
      - FORECAST_HEALTH_URL=http://forecast-engine:8006/health
      - SCENARIO_HEALTH_URL=http://scenario-engine:8002/health
      - RISK_HEALTH_URL=http://risk-engine:8003/health
      - RAG_HEALTH_URL=http://rag-service:8004/health
      - COPILOT_HEALTH_URL=http://copilot-agent:8005/health/live
      - DISASTER_ENGINE_URL=http://disaster-engine:8008
      - DISASTER_HEALTH_URL=${DISASTER_HEALTH_URL:-}
      - RATE_LIMIT_REDIS_URL=${RATE_LIMIT_REDIS_URL:-}
    depends_on:
      twin-state-mgr:
        condition: service_healthy
      forecast-engine:
        condition: service_healthy
      scenario-engine:
        condition: service_healthy
      risk-engine:
        condition: service_healthy
      rag-service:
        condition: service_healthy
      copilot-agent:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/live')"]
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  streamlit-dashboard:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.dashboard
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    environment:
      - API_BASE_URL=http://fastapi-gateway:8000
      - TWIN_STATE_URL=http://twin-state-mgr:8001
      - FORECAST_ENGINE_URL=http://forecast-engine:8006
      - COPILOT_API_URL=http://copilot-agent:8005
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    depends_on:
      fastapi-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8501')"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "1.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  report-service:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.report
    container_name: twin-report
    ports:
      - "${REPORT_PORT:-8007}:8007"
    environment:
      - GATEWAY_HOST=fastapi-gateway
      - GATEWAY_PORT=8000
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - REPORT_DIR=/reports
    volumes:
      - report_data:/reports
    depends_on:
      fastapi-gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 256M
          cpus: "0.25"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  redis:
    image: redis:7-alpine
    container_name: twin-redis
    profiles:
      - optional
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.5"
        reservations:
          memory: 64M
          cpus: "0.1"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  prometheus:
    image: prom/prometheus:v2.51.0
    profiles:
      - monitoring
    volumes:
      - ./deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O-", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  grafana:
    image: grafana/grafana:10.3.1
    profiles:
      - monitoring
    volumes:
      - ./deployment/monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
      - ./deployment/monitoring/grafana/dashboard.yml:/etc/grafana/provisioning/dashboards
      - ./deployment/monitoring/grafana/dashboards:/var/lib/grafana/dashboards
    ports:
      - "3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

  disaster-engine:
    build:
      context: .
      dockerfile: deployment/docker/Dockerfile.disaster
    profiles:
      - disaster
    ports:
      - "127.0.0.1:${DISASTER_PORT:-8008}:8008"
    volumes:
      - disaster_data:/data/disaster
      - disaster_models:/models
      # Named volume stays the default /models tree. Optional host bind is /mnt/host-models
      # (set HOST_MODEL_WEIGHTS_DIR=D:/ClimateDigitalTwin/models). The CPU DIE image has no
      # torch; learned U-Net still requires the learned/GPU runtime, not this mount alone.
      - ${HOST_MODEL_WEIGHTS_DIR:-./models/eo}:/mnt/host-models:ro
      - ./config:/app/config
    environment:
      - DISASTER_DATA_DIR=/data/disaster
      - TWIN_SERVICE_URL=http://twin-state-mgr:8001
      - TWIN_POINTER_ENABLED=${TWIN_POINTER_ENABLED:-true}
      - MODEL_FLOOD=${MODEL_FLOOD:-unet}
      - MODEL_FLOOD_FALLBACK=${MODEL_FLOOD_FALLBACK:-none}
      - MODEL_DEVICE=${MODEL_DEVICE:-auto}
      - MODEL_RUNTIME=${MODEL_RUNTIME:-auto}
      - GPU_ENABLED=${GPU_ENABLED:-false}
      - MODEL_WEIGHTS_DIR=${MODEL_WEIGHTS_DIR:-/models}
      - MODEL_WEIGHTS_UNET=${MODEL_WEIGHTS_UNET:-/mnt/host-models/flood/unet/model.pt}
      - MODEL_WEIGHTS_SEGFORMER=${MODEL_WEIGHTS_SEGFORMER:-}
      - MODEL_WEIGHTS_MASK2FORMER=${MODEL_WEIGHTS_MASK2FORMER:-}
      - MODEL_WEIGHTS_CHANGEFORMER=${MODEL_WEIGHTS_CHANGEFORMER:-}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - CDSE_USERNAME=${CDSE_USERNAME:-}
      - CDSE_PASSWORD=${CDSE_PASSWORD:-}
      - EARTHDATA_USERNAME=${EARTHDATA_USERNAME:-}
      - EARTHDATA_PASSWORD=${EARTHDATA_PASSWORD:-}
      - EARTHDATA_TOKEN=${EARTHDATA_TOKEN:-}
      - SH_CLIENT_ID=${SH_CLIENT_ID:-}
      - SH_CLIENT_SECRET=${SH_CLIENT_SECRET:-}
      - STAC_PROVIDER=${STAC_PROVIDER:-cdse}
      - STAC_FAILOVER=${STAC_FAILOVER:-false}
      - DIE_API_KEY=${DIE_API_KEY:-}
      - DIE_ALLOWED_ORIGINS=${DIE_ALLOWED_ORIGINS:-}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health/live')"]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M
          cpus: "0.25"
    restart: unless-stopped
    stop_grace_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - twin_network

volumes:
  twin_data:
  model_data:
  vector_store:
  ollama_data:
  report_data:
  redis_data:
  disaster_data:
  disaster_models:

networks:
  twin_network:
    name: twin_network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
