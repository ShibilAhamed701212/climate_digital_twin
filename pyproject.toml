[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-digital-twin"
version = "0.1.0"
description = "AI-Powered Digital Twin of India's Climate using Indian National Data (ISRO BAH 2026 — Challenge 5)"
readme = "README.md"
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "torch>=2.0",
    "pytorch-lightning>=2.0",
    "scikit-learn>=1.3",
    "fastapi>=0.104",
    "uvicorn[standard]>=0.24",
    "streamlit>=1.28",
    "plotly>=5.17",
    "folium>=0.15",
    "geopandas>=0.14",
    "shap>=0.43",
    "langchain>=0.1",
    "langchain-community>=0.1",
    "faiss-cpu>=1.7",
    "sentence-transformers>=2.2",
    "pyyaml>=6.0",
    "httpx>=0.25",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-asyncio>=0.23",
    "ruff>=0.1",
    "black>=23.12",
    "isort>=5.13",
    "pre-commit>=3.6",
    "mypy>=1.8",
    "tox>=4.12",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --cov=backend --cov=pipeline --cov=models --cov=simulator --cov=dashboard --cov=risk --cov=knowledge --cov=copilot --cov-report=term-missing"

[tool.coverage.run]
source = ["backend", "pipeline", "models", "simulator", "dashboard", "risk", "knowledge", "copilot"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line-length = 100

[tool.mypy]
python_version = "3.10"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py310, lint
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest tests/

[testenv:lint]
deps =
    ruff
commands =
    ruff check .
"""
