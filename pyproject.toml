[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "climate-digital-twin"
version = "2.1.0"
description = "AI-Powered Climate Digital Twin for India — Real-time climate monitoring, forecasting, risk assessment, and scenario simulation"
requires-python = ">=3.11"

dependencies = [
    # Backend & API
    "fastapi>=0.109,<1.0",
    "uvicorn[standard]>=0.27,<1.0",
    "httpx>=0.25,<1.0",
    "requests>=2.31",
    "aiohttp>=3.9,<4.0",

    # Data processing
    "pandas>=2.0,<3.0",
    "numpy>=1.24,<2.0",
    "scipy>=1.10,<2.0",
    "pyarrow>=14.0,<18.0",
    "pyyaml>=6.0",
    "python-dateutil>=2.8",
    "click>=8.1,<9.0",
    "python-dotenv>=1.0",
    "python-multipart>=0.0.9",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "cdsapi>=0.6",

    # ML & Forecasting
    "torch>=2.0,<3.0",
    "scikit-learn>=1.3,<2.0",
    "statsmodels>=0.14",
    "shap>=0.43",
    "xgboost>=2.0,<3.0",
    "prophet>=1.1,<2.0",
    "nltk>=3.8,<4.0",

    # RAG
    "faiss-cpu>=1.7,<2.0",
    "sentence-transformers>=2.2,<4.0",

    # Pydantic & validation
    "pydantic>=2.5,<3.0",

    # Dashboard
    "streamlit>=1.28,<2.0",
    "plotly>=5.17",
    "folium>=0.15",
    "streamlit-folium>=0.15",
    "geopandas>=0.14",

    # Scheduling
    "apscheduler>=3.10,<4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
    "pytest-asyncio>=0.23,<1.0",
    "coverage>=7.3",
    "ruff>=0.1,<0.7",
    "black>=23.12",
    "isort>=5.13",
    "pre-commit>=3.6",
    "mypy>=1.8",
    "tox>=4.12",
    "bandit>=1.7",
    "pip-audit>=2.6",
    "safety>=2.3",
]
ollama = [
    "ollama>=0.1,<1.0",
]
eo-learned = [
    "segmentation-models-pytorch>=0.3,<0.5",
    "rasterio>=1.3",
]
onnx = [
    "onnxruntime>=1.16",
]
era5 = [
    "xarray>=2023.1",
    "netCDF4>=1.6",
]
all = [
    "climate-digital-twin[dev,ollama,eo-learned,era5]",
]

[tool.setuptools.packages.find]
where = ["."]
exclude = ["tests*", "docs*"]

# Pytest lives in pytest.ini only (avoids "ignoring pytest config in pyproject.toml").

[tool.coverage.run]
source = ["backend", "pipeline", "simulator", "dashboard", "risk", "knowledge", "copilot", "disaster_intelligence"]
omit = ["*/tests/*", "*/__init__.py"]
# NOTE: models/ and runtime/ excluded from Windows coverage because torch C++ DLL crash
# (torch C++ SEH access violation on Windows — known env limitation)
# Full coverage for these packages is achievable on Linux CI where torch loads cleanly

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "def __repr__", "if __name__ == .__main__.:"]
show_missing = true
fail_under = 80

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"test_*.py" = ["N802", "N803", "N806"]
"dashboard/pages/*.py" = ["N999"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.isort]
profile = "black"
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
ignore_missing_imports = true

[tool.tox]
legacy_tox_ini = """
[tox]
envlist = py311, lint
isolated_build = True

[testenv]
deps =
    pytest
    pytest-cov
commands =
    pytest tests/

[testenv:lint]
deps =
    ruff
commands =
    ruff check .
"""
