name: CI & Quality Assurance

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks Secret Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  lint:
    name: Code Quality & Linting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff Check
        run: ruff check .
      - name: Ruff Format Check
        run: ruff format --check .

  test:
    name: Complete Test Suite & Coverage
    runs-on: ubuntu-latest
    needs: [security, lint]
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Download / Seed Datasets
        run: python scripts/download_data.py --dataset synthetic
      - name: Run Complete Test Suite
        run: python -m pytest tests/ --cov=climatedt --cov=backend --cov-report=xml
      - name: Upload Coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  docker:
    name: Container Build Verification
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push twin-state-mgr
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.twin_state_mgr
          tags: ${{ steps.meta.outputs.tags }}-twin-state-mgr
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push forecast-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.forecast
          tags: ${{ steps.meta.outputs.tags }}-forecast-engine
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push scenario-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.scenario
          tags: ${{ steps.meta.outputs.tags }}-scenario-engine
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push risk-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.risk
          tags: ${{ steps.meta.outputs.tags }}-risk-engine
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push rag-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.rag
          tags: ${{ steps.meta.outputs.tags }}-rag-service
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push copilot-agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.copilot
          tags: ${{ steps.meta.outputs.tags }}-copilot-agent
          push: ${{ github.event_name != 'pull_request' }}
