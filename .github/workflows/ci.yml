name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Ruff check
        run: ruff check . --exclude ".coverage,docs,__pycache__,.git"

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run unit tests
        run: python -m pytest tests/unit/ -q --tb=short -k "not (clean or download or export or features or validate)" -x

  docker:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=short
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
      - name: Build and push twin-state-mgr
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.twin_state_mgr
          tags: ${{ steps.meta.outputs.tags }}-twin-state-mgr
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push forecast-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.forecast
          tags: ${{ steps.meta.outputs.tags }}-forecast-engine
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push scenario-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.scenario
          tags: ${{ steps.meta.outputs.tags }}-scenario-engine
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push risk-engine
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.risk
          tags: ${{ steps.meta.outputs.tags }}-risk-engine
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push rag-service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.rag
          tags: ${{ steps.meta.outputs.tags }}-rag-service
          push: ${{ github.event_name != 'pull_request' }}
      - name: Build and push copilot-agent
        uses: docker/build-push-action@v5
        with:
          context: .
          file: deployment/docker/Dockerfile.copilot
          tags: ${{ steps.meta.outputs.tags }}-copilot-agent
          push: ${{ github.event_name != 'pull_request' }}
