llm:
  host: "${OLLAMA_HOST:-http://localhost:11434}"
  primary_model: "qwen:4b"
  temperature: 0.1
  max_tokens: 1024
  context_window: 8192

memory:
  type: "conversation_buffer_window"
  window_size: 10
  expiration_minutes: 60

orchestration:
  max_iterations: 5
  return_intermediate_steps: true

enabled_tools:
  - forecast_tool
  - digital_twin_tool
  - scenario_simulator
  - risk_assessor
  - rag_retriever
  - report_generator

prompt_paths:
  intent_classification: "copilot/prompts/intent.txt"
  planning: "copilot/prompts/planner.txt"
  response_generation: "copilot/prompts/generator.txt"
  error_handling: "copilot/prompts/error.txt"

performance_targets:
  simple_query_ms: 2000
  forecast_ms: 5000
  simulation_ms: 8000
  report_ms: 10000
